[project]
name = "knowledge-bot"
version = "0.1.0"
description = "RAG knowledge base bot with Discord and MCP interfaces"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.30.0",
    "chromadb>=0.4.0",
    "discord-py>=2.3.0",
    "langchain-anthropic>=1.4.8",
    "langchain-ollama>=1.1.0",
    "python-dotenv>=1.0.0",
    "ragas>=0.4.3",
    "sentence-transformers>=2.2.0",
    "trafilatura>=1.6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

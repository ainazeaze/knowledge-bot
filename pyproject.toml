[project]
name = "knowledge-bot"
version = "0.1.0"
description = "RAG knowledge base accessible via MCP tools in Claude Code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=0.4.0",
    "mcp>=1.28.1",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=2.2.0",
    "trafilatura>=1.6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.setuptools.packages.find]
include = ["knowledge_bot*"]

[tool.pytest.ini_options]
pythonpath = ["."]
